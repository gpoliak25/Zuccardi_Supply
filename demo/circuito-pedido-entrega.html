<style>
/* Layout: consola de operación — barra superior fija, navegación por frente a la izquierda, área de trabajo con tarjetas por rol */
:root{
  --bg:#F5F4F7; --surface:#FFFFFF; --sunk:#EEEBF1; --ink:#1E1A24; --muted:#675F72; --line:#E1DDE6;
  --accent:#7B1E3F; --accent-ink:#FFFFFF; --accent-soft:#F4E5EB;
  --ok:#23744A; --ok-soft:#E3F2E9; --warn:#9A6212; --warn-soft:#FBF0DC;
  --bad:#B42318; --bad-soft:#FBE6E3; --info:#2B5C8A; --info-soft:#E4EDF6;
  --f-display:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131116; --surface:#1C1920; --sunk:#25212A; --ink:#ECE8F1; --muted:#A49CAE; --line:#322D38;
  --accent:#E27C9F; --accent-ink:#1B0D13; --accent-soft:#3B1E2A;
  --ok:#5CC28A; --ok-soft:#173326; --warn:#E5AE55; --warn-soft:#3A2B12;
  --bad:#F27B6F; --bad-soft:#3E1C19; --info:#83AEDB; --info-soft:#1A2B3D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131116; --surface:#1C1920; --sunk:#25212A; --ink:#ECE8F1; --muted:#A49CAE; --line:#322D38;
  --accent:#E27C9F; --accent-ink:#1B0D13; --accent-soft:#3B1E2A;
  --ok:#5CC28A; --ok-soft:#173326; --warn:#E5AE55; --warn-soft:#3A2B12;
  --bad:#F27B6F; --bad-soft:#3E1C19; --info:#83AEDB; --info-soft:#1A2B3D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:.8rem;font-family:var(--f-mono)}
.top-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}

/* Estructura */
.shell{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;
  padding-block:24px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;display:flex;flex-direction:column;gap:2px}
.nav-g{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px}
.nav-b{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--ink)}
.nav-b:hover{background:var(--sunk)}
.nav-b.on{background:var(--accent-soft);color:var(--accent)}
.nav-b .l{font-weight:500}
.nav-b .c{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.nav-b.on .c{color:var(--accent)}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.side{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .nav-g{display:none}
  .nav-b{flex:0 0 auto}
}

/* Encabezado de vista */
.vh{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);max-width:72ch}
.jde{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.jde-t{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.jde ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.jde li{display:flex;gap:10px;align-items:baseline}
.jde li .pill{flex:0 0 auto}

/* Tarjetas y grillas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1080px){.g2,.g2e{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g3{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:500;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* Botones */
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500;text-decoration:underline;text-underline-offset:2px}

/* Formularios */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.75rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.field input,.field select,.inp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.inp.n{width:5.5em;text-align:right;font-variant-numeric:tabular-nums}
.ro{padding:6px 8px;border-radius:6px;background:var(--sunk);font-size:.92rem}
.dflt{font-size:.68rem;padding:0 6px;border-radius:999px;background:var(--info-soft);color:var(--info)}
.dflt.mod{background:var(--warn-soft);color:var(--warn)}

/* Tablas */
.tw{overflow-x:auto;margin:0 -2px}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
.t th{text-align:left;font-weight:500;font-size:.74rem;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.sel td{background:var(--accent-soft)}
.t tr.dim td{opacity:.5}
.t td.msgs{padding-top:0;border-bottom:1px solid var(--line)}
.t tr.has-msg td{border-bottom:0}

/* Mensajes */
.msg{display:flex;gap:8px;align-items:baseline;font-size:.84rem;padding:6px 10px;border-radius:6px}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.info{background:var(--info-soft);color:var(--info)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg b{font-weight:600}

/* Barras */
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.info{background:var(--info)} .bar i.mute{background:var(--muted);opacity:.5}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Circuito */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1180px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.flow{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.stage:hover{border-color:var(--accent)}
.stage .s-n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.stage .s-t{font-family:var(--f-display);font-weight:600;font-size:1.02rem}
.stage .s-v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stage .s-d{font-size:.8rem;color:var(--muted)}
.stage.alert{border-color:var(--bad)}
.stage.alert .s-v{color:var(--bad)}
.stage.warnb .s-v{color:var(--warn)}

ol.guide{margin:0;padding-left:1.4em;display:grid;gap:8px}
ol.guide li::marker{font-family:var(--f-mono);color:var(--accent)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:330px;overflow:auto}
.log li{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;font-size:.84rem}

/* Precio */
.wf{display:grid;gap:4px}
.wf-r{display:grid;grid-template-columns:3em minmax(0,1fr) auto auto;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.wf-r:last-child{border-bottom:0}
.wf-r.tot{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
.matrix td{text-align:center}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;width:100%;min-width:104px}
.cell:hover{border-color:var(--accent)}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cell .a{font-weight:600;font-variant-numeric:tabular-nums}
.cell .b{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Rutas */
.trip{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.trip-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.86rem}
ol.stops{margin:0;padding-left:1.3em;display:grid;gap:6px;font-size:.86rem}
ol.stops li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
ol.stops select{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:1px 4px;font-size:.78rem}

/* Reglas backorder */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.rule{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.rule:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.rule input{margin-top:3px;accent-color:var(--accent)}
.rule .rt{font-weight:600}
.rule .rd{font-size:.8rem;color:var(--muted)}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
input[type=range]{accent-color:var(--accent);width:100%}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.kpi .kv{font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi .kn{font-weight:600}
.kpi dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:.84rem}
.kpi dt{color:var(--muted)}
.kpi dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--sunk)}
.gauge i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--ok)}
.phase{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 4.5em;gap:10px;align-items:center;font-size:.86rem}
.pbar{height:10px;display:flex;border-radius:5px;overflow:hidden;background:var(--sunk)}
.pbar i{background:var(--accent)} .pbar u{background:var(--accent);opacity:.3}

.banner{border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.ok{background:var(--ok-soft);color:var(--ok)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;max-width:min(560px,calc(100vw - 32px));transition:opacity .2s, transform .2s;z-index:20}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

<script>
/* ===== Datos maestros de ejemplo ===== */
const TODAY='2026-10-20';
const ITEMS=[
  {id:'MAL-RES-750',d:'Malbec Reserva 750 ml',uxc:6,ums:['CJ','BT'],cjp:80,precio:54000,costo:29000},
  {id:'CAB-CLA-750',d:'Cabernet Sauvignon Clásico 750 ml',uxc:6,ums:['CJ','BT'],cjp:80,precio:39000,costo:22500},
  {id:'TOR-JOV-750',d:'Torrontés Joven 750 ml',uxc:6,ums:['CJ','BT'],cjp:80,precio:33600,costo:19800},
  {id:'BLD-ALT-750',d:'Blend de Altura 750 ml',uxc:6,ums:['CJ','BT'],cjp:80,precio:78000,costo:38000},
  {id:'ESP-BRU-750',d:'Espumante Brut Nature 750 ml',uxc:6,ums:['CJ','BT'],cjp:80,precio:61200,costo:33000},
  {id:'BON-BIB-3L',d:'Bonarda Bag-in-Box 3 L',uxc:4,ums:['CJ'],cjp:60,precio:44000,costo:27000},
];
const ITEM=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const ZONES={MZA:'Gran Mendoza',CUYO:'San Juan / San Luis',CENTRO:'Córdoba / Rosario',AMBA:'AMBA'};
const CONDS={RET:'Retiro en bodega',REP:'Reparto propio',FLI:'Flete incluido (tercerizado)',EXP:'Expreso a cargo del cliente'};
const ROUTES=[
  {id:'R-MZA-01',d:'Gran Mendoza Norte',z:'MZA',dias:'Lun · Mié · Vie',veh:'UT-03 Utilitario',cap:4,lead:1},
  {id:'R-MZA-02',d:'Gran Mendoza Sur',z:'MZA',dias:'Mar · Jue',veh:'CA-12 Camión chasis',cap:10,lead:1},
  {id:'R-CUYO-01',d:'San Juan / San Luis',z:'CUYO',dias:'Martes',veh:'CA-07 Camión chasis',cap:6,lead:2},
  {id:'R-CEN-01',d:'Córdoba / Rosario',z:'CENTRO',dias:'Jueves',veh:'Semi tercerizado',cap:26,lead:3},
  {id:'R-AMBA-N',d:'AMBA Norte',z:'AMBA',dias:'Lun · Jue',veh:'Semi tercerizado',cap:26,lead:3},
  {id:'RET',d:'Retiro en bodega / expreso',z:null,dias:'Lun a Vie 8 a 16 h',veh:null,cap:0,lead:0},
];
const ROUTE=Object.fromEntries(ROUTES.map(r=>[r.id,r]));
const CUSTS=[
  {id:'C1040',n:'Distribuidora Cuyo SRL',tipo:'Distribuidor',prio:'A',esq:'Gran cuenta',z:'CUYO',r:'R-CUYO-01',cond:'REP',dir:'Av. San Martín 2140, San Juan',ums:['CJ'],cred:25e6},
  {id:'C2210',n:'Supermercados del Valle SA',tipo:'Supermercado',prio:'A',esq:'Gran cuenta',z:'MZA',r:'R-MZA-02',cond:'REP',dir:'Carril Rodríguez Peña 3300, Godoy Cruz',ums:['CJ'],cred:8e6},
  {id:'C3055',n:'Vinoteca Los Andes',tipo:'Vinoteca',prio:'B',esq:'Estándar',z:'MZA',r:'RET',cond:'RET',dir:'Arístides Villanueva 410, Mendoza',ums:['CJ','BT'],cred:3e6},
  {id:'C4120',n:'Mayorista Pampa SA',tipo:'Distribuidor',prio:'A',esq:'Gran cuenta',z:'CENTRO',r:'R-CEN-01',cond:'FLI',dir:'Ruta 9 km 694, Córdoba',ums:['CJ'],cred:30e6},
  {id:'C5008',n:'Vinería Palermo',tipo:'Vinoteca',prio:'B',esq:'Estándar',z:'AMBA',r:'R-AMBA-N',cond:'FLI',dir:'Honduras 5120, CABA',ums:['CJ','BT'],cred:6e6},
  {id:'C6031',n:'Restó La Alameda',tipo:'Horeca',prio:'C',esq:'Estándar',z:'MZA',r:'R-MZA-01',cond:'REP',dir:'',ums:['CJ','BT'],cred:1.5e6},
  {id:'C7019',n:'Almacén Gourmet Rosario',tipo:'Vinoteca',prio:'C',esq:'Estándar',z:'CENTRO',r:'RET',cond:'EXP',dir:'Pellegrini 1650, Rosario',ums:['CJ','BT'],cred:1.2e6},
];
const CUST=Object.fromEntries(CUSTS.map(c=>[c.id,c]));
const HOLDS={PI:'Pedido incompleto: falta la dirección de entrega',PE:'La condición de envío no coincide con la ruta',CR:'Supera el límite de crédito'};
const RULES={
  hoy:{t:'Como hoy',d:'Sin criterio: lo último que se carga se libera primero.'},
  antig:{t:'Antigüedad',d:'El pedido más viejo se libera primero (FIFO).'},
  cliente:{t:'Prioridad de cliente',d:'Clientes A, después B y C; a igual prioridad, el más viejo.'},
  margen:{t:'Margen',d:'Primero las líneas con mayor margen.'},
  comb:{t:'Combinada',d:'Puntaje ponderado de antigüedad, cliente y margen.'},
};

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const nf1=new Intl.NumberFormat('es-AR',{maximumFractionDigits:1});
const nf0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const n1=v=>nf1.format(v), n0=v=>nf0.format(v);
const money=v=>'$ '+nf0.format(Math.round(v));
const pct=v=>(v>0?'+':v<0?'−':'')+nf1.format(Math.abs(v))+' %';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function diffDays(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
const dm=iso=>{const p=iso.split('-');return p[2]+'/'+p[1]};
const toCJ=l=>l.um==='BT'?l.qty/ITEM[l.item].uxc:l.qty;

/* ===== Precios (Advanced Pricing simulado) ===== */
function priceCore({esq,cond,zona,item,um,cj}){
  const P=state.pricing, it=ITEM[item];
  const base=um==='BT'?it.precio/it.uxc:it.precio;
  const adj=[];
  if(um==='BT') adj.push({seq:15,n:'Recargo por venta fraccionada (BT)',p:P.fraccion});
  if(esq==='Gran cuenta') adj.push({seq:20,n:'Esquema de cliente: Gran cuenta',p:P.granCuenta});
  if(cond==='RET') adj.push({seq:30,n:'Bonificación por retiro en bodega',p:P.retiro,env:1});
  if(cond==='REP') adj.push({seq:30,n:'Recargo reparto propio · zona '+zona,p:P.rep[zona],env:1});
  if(cond==='FLI') adj.push({seq:30,n:'Flete incluido · zona '+zona,p:P.fli[zona],env:1});
  if(cj>=P.vol2.min) adj.push({seq:40,n:'Bonificación por volumen ≥ '+P.vol2.min+' cj',p:P.vol2.pct});
  else if(cj>=P.vol1.min) adj.push({seq:40,n:'Bonificación por volumen ≥ '+P.vol1.min+' cj',p:P.vol1.pct});
  const neg=adj.filter(a=>a.p<0).reduce((s,a)=>s+a.p,0);
  if(neg<P.tope) adj.push({seq:90,n:'Tope de bonificaciones acumuladas ('+pct(P.tope)+')',p:P.tope-neg});
  const p=adj.reduce((s,a)=>s+a.p,0);
  return {base,adj,p,final:base*(1+p/100)};
}

function staleLines(){

}
function boAvgAge(){const b=boLines();return b.length?b.reduce((s,x)=>s+x.age,0)/b.length:0}

/* ===== Backorder: simulación de R42118 ===== */
function sortBO(list,rule){
  const pr={A:1,B:.5,C:0}, a=[...list];
  const maxA=Math.max(1,...a.map(x=>x.age)), ms=a.map(x=>x.margin), mn=Math.min(...ms), mx=Math.max(...ms);
  const W=state.bo.w, tw=(W.a+W.c+W.m)||1;
  a.forEach(x=>x.score=(W.a*x.age/maxA+W.c*pr[x.prio]+W.m*((x.margin-mn)/((mx-mn)||1)))/tw);
  const byAge=(p,q)=>q.age-p.age||p.o.so-q.o.so;
  if(rule==='hoy') a.sort((p,q)=>q.o.so-p.o.so);
  if(rule==='antig') a.sort(byAge);
  if(rule==='cliente') a.sort((p,q)=>pr[q.prio]-pr[p.prio]||byAge(p,q));
  if(rule==='margen') a.sort((p,q)=>q.margin-p.margin||byAge(p,q));
  if(rule==='comb') a.sort((p,q)=>q.score-p.score||byAge(p,q));
  return a;
}
function simulate(rule){
  const s=sums(), av={}; ITEMS.forEach(i=>av[i.id]=Math.max(0,avail(i.id,s)));
  const all=boLines(), list=sortBO(all.filter(x=>!x.held),rule);
  list.forEach(x=>{
    const it=ITEM[x.l.item], avU=x.l.um==='BT'?Math.floor(av[it.id]*it.uxc):Math.floor(av[it.id]);
    let rel=Math.min(avU,x.l.qty); if(!state.bo.partial&&rel<x.l.qty) rel=0;
    x.rel=rel; av[it.id]-=x.l.um==='BT'?rel/it.uxc:rel;
  });
  const relCJ=list.reduce((s,x)=>s+(x.l.um==='BT'?x.rel/ITEM[x.l.item].uxc:x.rel),0);
  const remain=all.map(x=>({age:x.age,cj:toCJ(x.l)-(x.rel?(x.l.um==='BT'?x.rel/ITEM[x.l.item].uxc:x.rel):0)})).filter(x=>x.cj>0.001);
  const remCJ=remain.reduce((s,x)=>s+x.cj,0);
  const avgAge=remCJ?remain.reduce((s,x)=>s+x.age*x.cj,0)/remCJ:0;
  const maxAge=remain.length?Math.max(...remain.map(x=>x.age)):0;
  const full=list.filter(x=>x.rel===x.l.qty).length;
  const aCJ=list.filter(x=>x.prio==='A').reduce((s,x)=>s+(x.rel?(x.l.um==='BT'?x.rel/ITEM[x.l.item].uxc:x.rel):0),0);
  return {list,relCJ,avgAge,maxAge,full,aShare:relCJ?aCJ/relCJ:0};
}

const pallets=o=>o.lines.filter(isComm).reduce((s,l)=>s+toCJ(l)/ITEM[l.item].cjp,0);
const readyFor=r=>state.orders.filter(o=>o.status==='abierto'&&!o.hold.length&&o.ruta===r&&o.lines.some(isComm));
function assign(r){
  const R=ROUTE[r], n=state.trips[r]||1, pr={A:0,B:1,C:2};
  const list=readyFor(r).sort((a,b)=>a.req.localeCompare(b.req)||pr[CUST[a.cust].prio]-pr[CUST[b.cust].prio]||a.so-b.so);
  if(r==='RET') return {trips:[{load:list.reduce((s,o)=>s+pallets(o),0),orders:list}],over:[]};
  const trips=Array.from({length:n},()=>({load:0,orders:[]})), over=[];
  list.forEach(o=>{const p=pallets(o),t=trips.find(t=>t.load+p<=R.cap+1e-9); if(t){t.load+=p;t.orders.push(o)} else over.push(o)});
  return {trips,over};
}

/* ===== Pedido en carga ===== */
function evalDraft(){
  const d=state.draft, c=CUST[d.cust], s=sums(), used={};
  const cj=d.lines.reduce((t,l)=>t+(l.qty>0&&ITEM[l.item].ums.includes(l.um)?toCJ(l):0),0);
  const fut=diffDays(TODAY,d.req)>state.consts.futDays;
  const seen={};
  const lines=d.lines.map(l=>{
    const it=ITEM[l.item], val=[];
    if(!c.ums.includes(l.um)) val.push(['err',`${c.n} compra solo por ${c.ums.join(' / ')}. Cargá la cantidad en cajas.`]);
    if(!it.ums.includes(l.um)) val.push(['err',`${it.d} no tiene conversión a ${l.um}: se vende por caja de ${it.uxc}.`]);
    if(!(l.qty>0)) val.push(['err','Ingresá una cantidad mayor a cero.']);
    if(seen[l.item]) val.push(['warn','Este ítem ya está en otra línea del pedido.']); seen[l.item]=1;
    const ok=!val.some(v=>v[0]==='err');
    if(ok&&l.um==='BT'&&l.qty%it.uxc===0) val.push(['warn',`${l.qty} botellas son ${l.qty/it.uxc} cajas cerradas: cargalo en CJ para evitar el recargo por fraccionado.`]);
    let cq=0,bo=0,fq=0;
    if(ok){
      if(fut) fq=l.qty;
      else{
        const av=Math.max(0,avail(l.item,s)-(used[l.item]||0));
        const avU=l.um==='BT'?Math.floor(av*it.uxc):Math.floor(av);
        cq=Math.min(avU,l.qty); bo=l.qty-cq; used[l.item]=(used[l.item]||0)+(l.um==='BT'?cq/it.uxc:cq);
        if(bo>0) val.push(['info',`Disponible ${n1(av)} cj: se comprometen ${cq} ${l.um} y ${bo} quedan en backorder.`]);
      }
    }
    const price=it.ums.includes(l.um)?priceFor(d.cust,d.cond,l.item,l.um,cj):null;
    return {...l,val,ok,cq,bo,fq,price,amount:price?price.final*(l.qty||0):0};
  });
  const total=lines.reduce((t,l)=>t+l.amount,0);
  const holds=[];
  if(!d.dir.trim()) holds.push('PI');
  if(!condRouteOk(d.cond,d.ruta)) holds.push('PE');
  if(total>c.cred) holds.push('CR');
  return {lines,total,cj,holds,fut,errs:lines.some(l=>!l.ok)};
}

        </tbody></table></div></section>

  <section class="card"><div class="card-h"><h2>Pedidos abiertos</h2><span class="muted">${state.orders.length} pedidos</span></div>

    ${recent.map(o=>`<tr><td class="mono">${o.so}</td><td>${esc(CUST[o.cust].n)}</td><td class="mono">${dm(o.date)}</td><td class="mono">${dm(o.req)}</td><td class="mono">${o.cond}</td><td class="mono">${o.ruta}</td>

};

VIEWS.compromiso=()=>{
  const s=sums(), stale=staleLines(), K=state.consts;
  const rows=ITEMS.map(i=>{const x=s[i.id],av=avail(i.id,s),tot=Math.max(state.inv[i.id],1);return {i,x,av,tot}});
  const staleCJ=stale.reduce((t,x)=>t+toCJ(x.l),0);
  return head('Frente 2 · Inventario y compromisos','Compromiso',
    'Muestra qué stock está tomado, por quién y desde cuándo. Se define en qué momento el compromiso pasa a duro, cuántos días antes de la entrega se compromete, y se detecta el stock comprometido por pedidos que no salen.',
    [['c','Constantes de sucursal/planta (P41001): método de compromiso y días de compromiso futuro.'],
     ['c','Reglas de línea de pedido para definir en qué paso se hace el compromiso duro (al imprimir el pick slip).'],
     ['d','Reporte de stock comprometido vs. disponible con antigüedad del compromiso.']])+`
  <div class="g2">
    <section class="card"><div class="card-h"><h2>Comprometido vs. disponible</h2><span class="mono muted">Sucursal MZA01 · en cajas</span></div>
      <div class="tw"><table class="t"><thead><tr><th>Ítem</th><th class="num">En mano</th><th class="num">Soft</th><th class="num">Hard</th><th class="num">Futuro</th><th class="num">Backorder</th><th class="num">Disponible</th><th style="min-width:130px">Uso del stock</th></tr></thead><tbody>
      ${rows.map(({i,x,av,tot})=>`<tr><td><span class="mono">${i.id}</span><br><span class="muted">${i.d}</span></td><td class="num">${n1(state.inv[i.id])}</td><td class="num">${n1(x.soft)}</td><td class="num">${n1(x.hard)}</td><td class="num">${x.fut?n1(x.fut):'—'}</td>
        <td class="num">${x.bo?`<span class="pill warn">${n1(x.bo)}</span>`:'—'}</td><td class="num"><b>${n1(av)}</b></td>
        <td><div class="bar" aria-label="Soft ${n1(x.soft)}, hard ${n1(x.hard)}, disponible ${n1(av)}"><i class="info" style="width:${x.soft/tot*100}%"></i><i style="width:${x.hard/tot*100}%"></i><i class="ok" style="width:${Math.max(0,av)/tot*100}%"></i></div></td></tr>`).join('')}
      </tbody></table></div>
      <div class="legend"><span><i style="background:var(--info)"></i>Soft: reservado en el pedido</span><span><i style="background:var(--accent)"></i>Hard: asignado a ubicación y lote</span><span><i style="background:var(--ok)"></i>Disponible</span></div>
    </section>
    <section class="card"><h2>Constantes de compromiso</h2>
      <div class="field"><label for="c-hard">Momento del compromiso duro</label><select id="c-hard" data-f="c.hardAt">${opt('pedido','Al grabar el pedido',K.hardAt)}${opt('pick','Al imprimir el pick slip (recomendado)',K.hardAt)}</select></div>
      <p class="muted">${K.hardAt==='pick'?'El pedido reserva cantidad (soft) y recién toma ubicación y lote al imprimir el pick slip. Evita bloquear pallets específicos por pedidos que todavía no van a salir.':'Cada pedido bloquea ubicación y lote desde que se graba. Es más rígido: si el pedido se demora, el depósito no puede usar ese stock.'}</p>
      <div class="field"><label for="c-fut">Días de compromiso futuro</label><input id="c-fut" class="inp n" type="number" min="0" max="60" value="${K.futDays}" data-f="c.futDays"></div>
      <p class="muted">Un pedido con entrega dentro de más de ${K.futDays} días no toma stock hoy; se compromete al acercarse la fecha.</p>
      <div class="field"><label for="c-stale">Alertar compromisos sin salida después de</label><div class="row"><input id="c-stale" class="inp n" type="number" min="1" max="60" value="${K.staleDays}" data-f="c.staleDays"><span class="muted">días</span></div></div>
    </section>
  </div>
  <section class="card"><div class="card-h"><h2>Stock comprometido que no sale</h2>${stale.length?`<span class="pill bad">${stale.length} líneas · ${n1(staleCJ)} cj bloqueadas</span>`:'<span class="pill ok">Sin alertas</span>'}</div>
    <p class="muted">Pedidos retenidos o con más de ${K.staleDays} días sin pick slip que siguen ocupando stock. Al liberar el compromiso, la línea pasa a backorder y el stock queda disponible para la próxima corrida de liberación.</p>
    ${stale.length?`<div class="tw"><table class="t"><thead><tr><th>Pedido</th><th>Cliente</th><th>Ítem</th><th class="num">Cajas</th><th class="num">Comprometido hace</th><th>Motivo</th><th></th></tr></thead><tbody>
    ${stale.map(({o,l,age})=>`<tr><td class="mono">${o.so}</td><td>${esc(CUST[o.cust].n)}</td><td class="mono">${l.item}</td><td class="num">${n1(toCJ(l))}</td><td class="num">${age} días</td>
      <td>${o.hold.length?o.hold.map(h=>`<span class="pill bad">${h} · ${HOLDS[h].split(':')[0]}</span>`).join(' '):'<span class="pill warn">Sin pick slip</span>'}</td>
      <td><button class="btn sm" data-act="uncommit" data-arg="${o.so}|${o.lines.indexOf(l)}" type="button">Liberar compromiso</button></td></tr>`).join('')}
    </tbody></table></div><div class="row"><button class="btn" data-act="uncommitAll" type="button">Liberar todos</button></div>`:''}
  </section>`;
};

VIEWS.backorder=()=>{
  const B=state.bo, sim=simulate(B.rule), all=boLines(), held=all.filter(x=>x.held);
  const comp=Object.keys(RULES).map(k=>({k,...simulate(k)}));
  const buckets=[['0 a 3 días',0,3],['4 a 7 días',4,7],['8 a 14 días',8,14],['Más de 14 días',15,999]].map(([n,a,b])=>({n,cj:all.filter(x=>x.age>=a&&x.age<=b).reduce((t,x)=>t+toCJ(x.l),0)}));
  const maxB=Math.max(1,...buckets.map(b=>b.cj));
  const s=sums();
  return head('Frente 3 · Backorder Release','Liberación de backorder',
    'La liberación deja de ser manual: corre por lotes en horario fijo con una regla de priorización explícita. Antes de ejecutar se puede comparar qué pasaría con cada regla.',
    [['c','Versión de R42118 con selección de datos y secuencia según la regla acordada.'],
     ['c','Programación en el servidor de procesos batch: corridas a las 06:00 y a las 13:30.'],
     ['d','Tablero de backorders con antigüedad (consulta o UDO de tipo watchlist).']])+`
  <div class="g3">
    <section class="card"><h3>Corridas programadas</h3><div class="stack">
      <div class="row" style="justify-content:space-between"><span class="mono">06:00</span><span class="pill ok">Ejecutada</span></div>
      <div class="row" style="justify-content:space-between"><span class="mono">13:30</span><span class="pill">Próxima</span></div>
      <p class="muted">${B.runs?`Ejecuciones manuales en la demo: ${B.runs}.`:'Lun a vie. Se puede ejecutar ahora para la demo.'}</p></div></section>
    <section class="card"><h3>Recepciones del día</h3>
      <p class="muted">OC 4471 · Blend de Altura +36 cj, Espumante Brut +40 cj, Torrontés +60 cj.</p>
      <button class="btn${state.receipt?'':' pri'}" data-act="receipt" type="button"${state.receipt?' disabled':''}>${state.receipt?'Recepción registrada':'Registrar recepción OC 4471'}</button></section>
    <section class="card"><h3>Disponible para liberar</h3><div class="stack">
      ${ITEMS.filter(i=>s[i.id].bo>0).map(i=>`<div class="row" style="justify-content:space-between"><span class="mono">${i.id}</span><span class="num">${n1(Math.max(0,avail(i.id,s)))} de ${n1(s[i.id].bo)} cj</span></div>`).join('')||'<p class="muted">No hay backorder pendiente.</p>'}</div></section>
  </div>
  <section class="card"><h2>Regla de priorización</h2>
    <div class="rules">${Object.entries(RULES).map(([k,r])=>`<label class="rule"><input type="radio" name="borule" value="${k}" data-f="bo.rule"${B.rule===k?' checked':''}><span><span class="rt">${r.t}</span><br><span class="rd">${r.d}</span></span></label>`).join('')}</div>
    ${B.rule==='comb'?`<div class="sliders">${[['a','Antigüedad'],['c','Prioridad de cliente'],['m','Margen']].map(([k,n])=>`<div class="field"><label for="w-${k}">${n} · <b>${B.w[k]}</b></label><input id="w-${k}" type="range" min="0" max="100" step="5" value="${B.w[k]}" data-f="bo.w:${k}"></div>`).join('')}</div>`:''}
    <label class="row"><input id="bo-part" type="checkbox" data-f="bo.partial"${B.partial?' checked':''} style="accent-color:var(--accent)"> Permitir liberación parcial de líneas</label>
  </section>
  <section class="card"><div class="card-h"><h2>Comparación de reglas con el stock de hoy</h2><span class="muted">Simulación, no modifica pedidos</span></div>
    <div class="tw"><table class="t"><thead><tr><th>Regla</th><th class="num">Cajas liberadas</th><th class="num">Líneas completas</th><th class="num">% a clientes A</th><th class="num">Antigüedad prom. del BO que queda</th><th class="num">Más vieja que queda</th></tr></thead><tbody>
    ${comp.map(c=>`<tr class="${c.k===B.rule?'sel':''}"><td>${RULES[c.k].t}</td><td class="num">${n1(c.relCJ)}</td><td class="num">${c.full}</td><td class="num">${c.relCJ?n0(c.aShare*100)+' %':'—'}</td><td class="num">${n1(c.avgAge)} días</td><td class="num">${c.maxAge} días</td></tr>`).join('')}
    </tbody></table></div>
    ${!state.receipt?`<div class="msg info">Todavía no hay stock para liberar. Registrá la recepción de la OC 4471 para ver la diferencia entre reglas.</div>`:''}
  </section>
  <div class="g2">
    <section class="card"><div class="card-h"><h2>Orden de liberación · ${RULES[B.rule].t}</h2><button class="btn pri" data-act="runBO" type="button"${sim.relCJ?'':' disabled'}>Ejecutar liberación (R42118)</button></div>
      <div class="tw"><table class="t"><thead><tr><th>#</th><th>Pedido</th><th>Cliente</th><th>Ítem</th><th class="num">Pendiente</th><th class="num">Antig.</th><th class="num">Margen</th><th>Resultado</th></tr></thead><tbody>
      ${sim.list.map((x,i)=>`<tr><td class="mono muted">${i+1}</td><td class="mono">${x.o.so}</td><td>${esc(CUST[x.o.cust].n)} <span class="pill acc">${x.prio}</span></td><td class="mono">${x.l.item}</td><td class="num">${x.l.qty} ${x.l.um}</td><td class="num">${x.age} d</td><td class="num">${n0(x.margin*100)} %</td>
        <td>${x.rel===x.l.qty?'<span class="pill ok">Libera</span>':x.rel>0?`<span class="pill warn">Parcial ${x.rel}</span>`:'<span class="pill">Sigue en BO</span>'}</td></tr>`).join('')}
      ${held.map(x=>`<tr class="dim"><td></td><td class="mono">${x.o.so}</td><td>${esc(CUST[x.o.cust].n)}</td><td class="mono">${x.l.item}</td><td class="num">${x.l.qty} ${x.l.um}</td><td class="num">${x.age} d</td><td></td><td><span class="pill bad">Retenido ${x.o.hold.join(', ')}</span></td></tr>`).join('')}
      ${!all.length?'<tr><td colspan="8" class="muted">No hay líneas en backorder.</td></tr>':''}
      </tbody></table></div></section>
    <section class="card"><h2>Antigüedad del backorder</h2>
      <div class="stack">${buckets.map(b=>`<div class="stack" style="gap:3px"><div class="row" style="justify-content:space-between"><span>${b.n}</span><span class="num">${n1(b.cj)} cj</span></div><div class="bar"><i class="${b.n.startsWith('Más')?'bad':b.n.startsWith('8')?'warn':'info'}" style="width:${b.cj/maxB*100}%"></i></div></div>`).join('')}</div>
      <p class="muted">Promedio actual: <b>${n1(boAvgAge())} días</b> en ${all.length} líneas.</p></section>
  </div>`;
};

VIEWS.ruta=()=>{
  const pick=state.slips;
  return head('Frente 4 · Transportation','Armado de ruta',
    'Cada cliente trae su ruta por defecto. Los pedidos listos se consolidan por ruta y se cargan en el vehículo según la capacidad en pallets, antes de imprimir un único pick slip por viaje.',
    [['c','Zonas (42/ZN) y rutas (42/RT) con días de salida, asignadas por defecto desde el cliente.'],
     ['c','Impresión de pick slips (R42520) seleccionando por ruta, para consolidar el picking por viaje.'],
     ['d','Evaluar el módulo Transportation de JDE (cargas y vehículos) o un optimizador de ruteo externo integrado por orquestación.']])+`
  <div class="stack" style="gap:16px">${ROUTES.map(R=>{
    const {trips,over}=assign(R.id), n=trips.reduce((t,x)=>t+x.orders.length,0)+over.length;
    if(!n&&R.id!=='RET') return `<section class="card"><div class="card-h"><h3><span class="mono">${R.id}</span> · ${R.d}</h3><span class="muted">${R.dias} · ${R.veh} ${R.cap} pallets · sin pedidos listos</span></div></section>`;
    return `<section class="card"><div class="card-h"><h2><span class="mono">${R.id}</span> · ${R.d}</h2><span class="muted">${R.z?`Zona ${R.z} · `:''}${R.dias}${R.veh?` · ${R.veh} de ${R.cap} pallets`:''}</span></div>
      ${trips.map((t,i)=>{const u=R.cap?t.load/R.cap:0,cls=u>.95?'warn':u<.3?'info':'ok';
        return `<div class="trip"><div class="trip-h"><b>${R.veh?`Viaje ${i+1} · ${R.veh}`:'Retira el cliente o su expreso'}</b><span class="num">${n1(t.load)}${R.cap?` de ${R.cap} pallets · ${n0(u*100)} %`:' pallets'}</span></div>
          ${R.cap?`<div class="bar"><i class="${cls}" style="width:${Math.min(100,u*100)}%"></i></div>`:''}

/* ===== Acciones ===== */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3200)}
const commitSt=()=>state.consts.hardAt==='pedido'?'hard':'soft';
const ACT={
  go(v){state.view=v;try{history.replaceState(null,'','#'+v)}catch(e){};render();window.scrollTo(0,0)},
  addLine(){state.draft.lines.push({item:'TOR-JOV-750',um:'CJ',qty:12});state.draft.sel=state.draft.lines.length-1},
  delLine(i){state.draft.lines.splice(+i,1);state.draft.sel=0},
  selLine(i){state.draft.sel=+i},
  fixRoute(){const d=state.draft,c=CUST[d.cust];d.ruta=(d.cond==='RET'||d.cond==='EXP')?'RET':(c.r!=='RET'?c.r:(ROUTES.find(r=>r.z===c.z)||ROUTES[0]).id);toast('Ruta ajustada a '+d.ruta)},
  save(){
    const E=evalDraft(), d=state.draft; if(E.errs) return;
    const so=state.nextSO++, lines=[];
    E.lines.forEach(l=>{
      const base={item:l.item,um:l.um,price:l.price.final,at:TODAY};
      if(l.fq) lines.push({...base,qty:l.fq,st:'fut'});
      if(l.cq) lines.push({...base,qty:l.cq,st:commitSt()});
      if(l.bo) lines.push({...base,qty:l.bo,st:'bo'});
    });
    state.orders.push({so,cust:d.cust,date:TODAY,req:d.req,cond:d.cond,ruta:d.ruta,dir:d.dir,hold:E.holds,status:'abierto',lines,firstOk:!E.holds.includes('PE'),session:true});
    state.lastSaved=so;
    log(`Pedido ${so} grabado para ${CUST[d.cust].n}${E.holds.length?' · retenido '+E.holds.join(', '):''}.`,6);
    state.draft=newDraft(d.cust,[{item:'MAL-RES-750',um:'CJ',qty:20}]);
    toast(`Pedido ${so} grabado`);
  },
  unhold(so){const o=state.orders.find(x=>x.so===+so);if(o.hold.includes('PI')&&!o.dir)o.dir='Dirección completada al liberar';
    if(o.hold.includes('PE'))o.ruta=(o.cond==='RET'||o.cond==='EXP')?'RET':CUST[o.cust].r;
    log(`Retención ${o.hold.join(', ')} liberada en el pedido ${o.so}.`);o.hold=[];toast(`Pedido ${so} liberado`)},
  uncommit(arg){const [so,i]=arg.split('|'),o=state.orders.find(x=>x.so===+so),l=o.lines[+i];l.st='bo';log(`Compromiso liberado: ${o.so} ${l.item} ${l.qty} ${l.um} vuelve al disponible.`);toast('Stock liberado al disponible')},
  uncommitAll(){const st=staleLines();st.forEach(x=>x.l.st='bo');log(`Se liberaron ${st.length} compromisos sin salida.`);toast(`${st.length} compromisos liberados`)},
  receipt(){state.inv['BLD-ALT-750']+=36;state.inv['ESP-BRU-750']+=40;state.inv['TOR-JOV-750']+=60;state.receipt=true;log('Recepción de la OC 4471 registrada: +36 BLD, +40 ESP, +60 TOR.',5);toast('Recepción registrada')},
  runBO(){
    const sim=simulate(state.bo.rule); let n=0;
    sim.list.forEach(x=>{ if(!x.rel) return; n++;
      if(x.rel===x.l.qty){x.l.st=commitSt();x.l.at=TODAY}
      else{x.l.qty-=x.rel;x.o.lines.splice(x.o.lines.indexOf(x.l)+1,0,{...x.l,qty:x.rel,st:commitSt(),at:TODAY})}
      if(x.o.status==='desp') x.o.status='abierto';
    });
    state.bo.runs++; log(`R42118 · regla ${RULES[state.bo.rule].t}: ${n} líneas liberadas, ${n1(sim.relCJ)} cj.`,4);
    toast(`${n} líneas liberadas del backorder`);
  },
  addTrip(r){state.trips[r]=(state.trips[r]||1)+1;log(`Se agregó un viaje a la ruta ${r}.`,2);toast('Viaje agregado')},
  delTrip(r){state.trips[r]=Math.max(1,(state.trips[r]||1)-1)},
  pick(r){
    const R=ROUTE[r],{trips}=assign(r); let made=0;
    trips.forEach((t,i)=>{ if(!t.orders.length) return;
      const id='PS-'+(state.nextSlip++), items={};
      t.orders.forEach(o=>{o.status='pick';o.slip=id;o.lines.filter(isComm).forEach(l=>{l.st='hard';items[l.item]=(items[l.item]||0)+toCJ(l)})});
      state.slips.unshift({id,ruta:r,veh:R.veh?`Viaje ${i+1} · ${R.veh}`:'',orders:t.orders.map(o=>o.so),items,status:'impreso'}); made++;
    });
    log(`Ruta ${r}: ${made} pick slip${made>1?'s':''} consolidado${made>1?'s':''} impreso${made>1?'s':''} (R42520).`,8);
    toast(`${made} pick slip${made>1?'s':''} generado${made>1?'s':''}`);
  },
  ship(id){
    const p=state.slips.find(x=>x.id===id);
    p.orders.forEach(so=>{const o=state.orders.find(x=>x.so===so);
      o.lines.filter(isComm).forEach(l=>{state.inv[l.item]-=toCJ(l);l.st='ship'});
      o.status='desp';o.onTime=TODAY<=o.req;});
    p.status='despachado'; log(`Despacho confirmado de ${p.id} (${p.orders.length} pedidos).`,10); toast(`${p.id} despachado`);
  },
  cell(arg){const [c,z]=arg.split('|');state.ps.cond=c;state.ps.zona=z},
};
function setPath(obj,path,v){const k=path.split('.');let o=obj;while(k.length>1)o=o[k.shift()];o[k[0]]=v}
function onField(key,v,el){
  const [k,arg]=key.split(':'), d=state.draft;
  switch(k){
    case 'd.cust': state.draft=newDraft(v,d.lines); break;
    case 'd.cond': d.cond=v; break;
    case 'd.ruta': d.ruta=v; break;
    case 'd.dir': d.dir=v; break;
    case 'd.req': if(v) d.req=v; break;
    case 'l.item': d.lines[+arg].item=v; d.sel=+arg; break;
    case 'l.um': d.lines[+arg].um=v; d.sel=+arg; break;
    case 'l.qty': d.lines[+arg].qty=Math.max(0,Math.round(Number(v)||0)); d.sel=+arg; break;
    case 'c.hardAt': state.consts.hardAt=v; log('Constante: compromiso duro '+(v==='pick'?'al imprimir el pick slip.':'al grabar el pedido.'),1); break;
    case 'c.futDays': state.consts.futDays=Math.max(0,Number(v)||0); break;
    case 'c.staleDays': state.consts.staleDays=Math.max(1,Number(v)||1); break;
    case 'bo.rule': state.bo.rule=v; break;
    case 'bo.partial': state.bo.partial=el.checked; break;
    case 'bo.w': state.bo.w[arg]=Number(v); break;
    case 'o.ruta': {const o=state.orders.find(x=>x.so===+arg); o.ruta=v; log(`Pedido ${o.so} pasado a la ruta ${v}.`,1); break}
    case 'ps.item': state.ps.item=v; break;
    case 'ps.esq': state.ps.esq=v; break;
    case 'ps.cj': state.ps.cj=Math.max(1,Number(v)||1); break;
    case 'p': if(v!==''&&!isNaN(Number(v))) setPath(state.pricing,arg,Number(v)); break;
  }
  render();
}

function renderNav(){
  $('#nav').innerHTML=NAV.map(x=>x.g?`<div class="nav-g">${x.g}</div>`:`<button type="button" class="nav-b${state.view===x.v?' on':''}" data-view="${x.v}"${state.view===x.v?' aria-current="page"':''}><span class="l">${x.l}</span><span class="c">${x.c}</span></button>`).join('');
}
function render(){
  const act=document.activeElement&&document.activeElement.id;
  renderNav();
  $('#main').innerHTML=VIEWS[state.view]();
  $('#clock').textContent='20/10/2026 '+clockStr();
  if(act){const el=document.getElementById(act); if(el&&el.closest('#main')) el.focus()}
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)ACT.go(b.dataset.view)});
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const fn=ACT[b.dataset.act];if(!fn)return;fn(b.dataset.arg,b);if(b.dataset.act!=='go')render()});
$('#main').addEventListener('change',e=>{const f=e.target.closest('[data-f]');if(f)onField(f.dataset.f,f.value,f)});
$('#reset').addEventListener('click',()=>{const v=state.view;seed();state.view=v;render();toast('Demo reiniciada')});

seed();
try{const h=location.hash.slice(1);if(VIEWS[h])state.view=h}catch(e){}
render();
</script>
